<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #f4f4f9; }
        .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #message { margin-top: 15px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Створити акаунт</h2>
    <input type="text" id="username" placeholder="Логін">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Пароль">
    <button onclick="registerUser()">Зареєструватися</button>
    <div id="message"></div>
</div>

<script>
    async function registerUser() {
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const msgDiv = document.getElementById('message');

        // Відправляємо дані на наш API
        const response = await fetch('/api/registration/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password })
        });

        if (response.ok) {
            msgDiv.innerText = "Успіх! Користувача створено.";
            msgDiv.style.color = "green";
        } else {
            const data = await response.json();
            msgDiv.innerText = "Помилка: " + JSON.stringify(data);
            msgDiv.style.color = "red";
        }
    }
</script>

</body>
</html>
