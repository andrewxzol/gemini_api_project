<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналіз зображень | Gemini App</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <style>
        .header-ui { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logout-btn { background: #ff4757; width: auto; padding: 5px 15px; font-size: 12px; }
        .logout-btn:hover { background: #ff6b81; }
        #result-container { margin-top: 20px; padding: 15px; background: #eef2f7; border-radius: 6px; display: none; }
        .user-greeting { font-weight: bold; color: #007bff; }
    </style>
</head>
<body>
    <script>
        // Блокувальник: якщо токена немає, ми навіть не показуємо сторінку
        if (!localStorage.getItem('userToken')) {
            window.location.href = '/login/';
        }
    </script>

    <div class="form-container" style="width: 500px;">
        <div class="header-ui">
            <div>Привіт, <span id="display-username" class="user-greeting">Користувач</span>!</div>
            <button class="logout-btn" onclick="logout()">Вийти</button>
        </div>

        <h2>Аналіз зображення Gemini</h2>

        <input type="file" id="imageInput" accept="image/*">
        <button id="uploadBtn" onclick="uploadImage()">Проаналізувати</button>

        <div id="message"></div>

        <div id="result-container">
            <strong>Результат аналізу:</strong>
            <p id="analysis-text" style="font-size: 14px; line-height: 1.6; color: #333;"></p>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
