{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>AI Аналіз | Gemini</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
    <script>
        // Перевіряємо токен. Якщо його немає — на сторінку входу.
        // Використовуй '/' на початку, щоб шлях був абсолютним від домену
        if (!localStorage.getItem('userToken')) {
            window.location.href = '/login/';
        }

        // Відображення імені користувача (зберігаємо при логіні)
        document.addEventListener('DOMContentLoaded', () => {
            const username = localStorage.getItem('username') || 'Користувач';
            document.getElementById('display-username').textContent = username;
        });

        function logout() {
            localStorage.clear();
            window.location.href = '/login/';
        }
    </script>

    <div class="dashboard-card">
        <div class="header-ui">
            <div class="user-badge">
                👋 Привіт, <span id="display-username">...</span>
            </div>
            <a href="#" class="logout-link" onclick="logout()">Вийти</a>
        </div>

        <h2 style="margin-top: 0;">Аналіз зображення Gemini AI</h2>
        <p style="color: #64748b; margin-bottom: 25px;">Завантажте фото, щоб отримати детальний опис об'єктів від штучного інтелекту.</p>

        <div class="upload-zone">
            <input type="file" id="imageInput" accept="image/*">
            <button id="uploadBtn" onclick="uploadImage()">Проаналізувати фото</button>
        </div>

        <div id="message" style="text-align: center; font-weight: 500;"></div>

        <div id="result-container" style="display: none;">
            <h4 style="margin-top: 0; color: #1e293b;">✨ Результат аналізу:</h4>
            <div id="analysis-text"></div>
        </div>
    </div>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
